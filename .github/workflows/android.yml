name: Build Jarvis Android App

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - 'arena/**'
  pull_request:
    branches:
      - main
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # CHANGED (owner decision, 2026-09-07): the owner hardcodes the NVIDIA NIM key in
  # ApiConfig.kt and accepts the risk, so this job no longer tries to police that one
  # key -- doing so would fail every build forever. It still polices everything else.
  #
  # The sanctioned key is read out of ApiConfig.kt at scan time and excluded by exact
  # value, so this workflow never contains a credential itself, and any *other*
  # secret-shaped literal -- a Gemini key, a second NVIDIA key, a GitHub/AWS/OpenAI/
  # Slack token -- still fails the build. Rotate by editing ApiConfig.kt only.
  secret-scan:
    name: Reject new committed credentials
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Scan tracked source for credential patterns
        run: |
          set -uo pipefail
          APICONFIG=app/src/main/java/com/jarvis/app/config/ApiConfig.kt
          SANCTIONED=$(sed -n 's/.*get() = "\(nvapi-[^"]*\)".*/\1/p' "$APICONFIG" | head -1)

          pattern='(nvapi-[A-Za-z0-9_-]{20,}|sk_[A-Za-z0-9]{20,}|sk-[A-Za-z0-9]{20,}|AIza[0-9A-Za-z_-]{30,}|ghp_[A-Za-z0-9]{20,}|gho_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|AKIA[0-9A-Z]{16}|xox[baprs]-[A-Za-z0-9-]{10,})'

          hits=$(git grep -nIE "$pattern" -- \
              '*.kt' '*.kts' '*.java' '*.xml' '*.py' '*.ts' '*.js' '*.json' \
              '*.sh' '*.yml' '*.yaml' '*.properties' '*.toml' || true)

          if [ -n "$SANCTIONED" ]; then
            hits=$(printf '%s\n' "$hits" | grep -vF -- "$SANCTIONED" || true)
          fi
          hits=$(printf '%s\n' "$hits" | sed '/^[[:space:]]*$/d')

          if [ -n "$hits" ]; then
            echo "::error::Unsanctioned credential-shaped literal in tracked source."
            printf '%s\n' "$hits" | sed -E 's/((nvapi-|sk_?|AIza|ghp_|gho_|github_pat_|AKIA|xox.)[A-Za-z0-9_-]{4})[A-Za-z0-9_-]+/\1<REDACTED>/g'
            echo "Only the NVIDIA key in $APICONFIG is sanctioned. Everything else"
            echo "belongs in Actions secrets or gitignored local.properties."
            exit 1
          fi
          echo "No unsanctioned credential patterns in tracked source."

  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: write   # to commit KSP-exported Room schemas back to the branch
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

      # Runs before Gradle so a missing migration fails in seconds rather than after a
      # full build. Source-level only: it parses AppDatabase.kt / Migrations.kt.
      - name: Room migration policy (source check)
        run: python3 scripts/check_room_migrations.py

      - name: Make gradlew executable
        run: |
          sed -i -e 's/\r$//' gradlew
          chmod +x ./gradlew

      # FIX (audit P0-B): the previous "Create local.properties for CI" step wrote the
      # keys into local.properties, but app/build.gradle.kts read them from
      # System.getenv() -- which local.properties never populates. Every key compiled
      # in as an empty string. Secrets are now passed as environment variables, which
      # is what the build script actually reads (env first, local.properties second).
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon
        env:
          # Only Gemini is injected: NVIDIA's key is hardcoded in ApiConfig.kt by
          # owner decision, so BuildConfig no longer carries it.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      # Now that KSP has run, the exported JSON must exist for every version from the
      # baseline up. This is the check that cannot be done from source alone.
      - name: Room migration policy (exported schemas)
        run: python3 scripts/check_room_migrations.py --check-schemas app/schemas

      # Schemas are generated, not hand-written, but they MUST be committed: they are the
      # history future migrations are written against and what AutoMigration /
      # MigrationTestHelper need. This sandbox cannot download build artifacts, so CI
      # commits them back instead of leaving them stranded in an artifact. Idempotent --
      # once committed, later runs find no diff and exit immediately.
      - name: Commit exported Room schemas
        if: github.event_name == 'push'
        run: |
          set -uo pipefail
          if [ ! -d app/schemas ]; then
            echo "KSP produced no app/schemas directory."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/schemas
          if git diff --cached --quiet; then
            echo "Exported Room schemas are already committed."
            exit 0
          fi
          files=$(git diff --cached --name-only | tr '\n' ' ')
          git commit -m "chore(room): export schema JSON [skip ci]

Generated by KSP from the @Database annotation during the Android build.
Committed by CI because these files are the migration history: future
migrations, AutoMigration and MigrationTestHelper all read them.

Files: $files"
          # The branch may have moved since checkout; rebase rather than force anything.
          git fetch origin "$GITHUB_REF_NAME"
          if ! git rebase "origin/$GITHUB_REF_NAME"; then
            echo "::warning::rebase onto the moved branch failed; exported schemas not committed this run"
            git rebase --abort || true
            exit 0
          fi
          if git push origin "HEAD:$GITHUB_REF_NAME"; then
            echo "Committed exported schemas: $files"
          else
            echo "::warning::could not push exported schemas; commit them manually from app/schemas"
          fi

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace --no-daemon
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Report APK size
        run: |
          apk=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          size=$(stat -c%s "$apk")
          echo "APK: $apk"
          echo "Size: $((size / 1024 / 1024)) MiB ($size bytes)"
          echo "size_bytes=$size" >> "$GITHUB_OUTPUT"
        id: apksize

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  # Regression gate for the reasoning layer: runs eval/jarvis_eval.py against the live
  # NVIDIA endpoint and checks the model still picks the right tool for each acceptance
  # utterance. Deliberately has no `needs:` -- a brain regression must be visible, but
  # it must not stop the debug APK from being produced.
  #
  # ADVISORY for now (continue-on-error). This gate had never actually been executed
  # before it was wired in here, and it is currently known to be unfaithful to
  # production: it offers the model 12 hand-written tool schemas while the app sends
  # ToolSchema.forOpenAI() -- every tool in EXPOSED_CATEGORIES (~69), including
  # near-duplicate pairs like open_app/app_launch and send_sms/send_message/send_whatsapp.
  # So a green run here does not yet prove production routing works. Tracked as
  # "eval harness fidelity" in the implementation plan; flip to blocking once the
  # harness generates its tool list from ToolSchema.kt instead of hardcoding one.
  #
  # Failures are echoed as annotations because Actions log download is unreliable from
  # automation; annotations are readable through the check-runs API.
  eval:
    name: Brain eval (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run eval harness
        run: |
          set -uo pipefail
          python eval/jarvis_eval.py 2>&1 | tee eval-output.txt
          status=${PIPESTATUS[0]}
          echo "### Brain eval" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat eval-output.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            echo "::error::Brain eval failed (exit $status)"
            tail -n 40 eval-output.txt | while IFS= read -r line; do
              [ -n "$line" ] && echo "::error::${line}"
            done
          fi
          exit "$status"
