name: Build Jarvis Android App

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - 'arena/**'
  pull_request:
    branches:
      - main
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

      - name: Create local.properties for CI
        run: cp local.properties.example local.properties

      - name: Make gradlew executable
        run: |
          sed -i -e 's/\r$//' gradlew
          chmod +x ./gradlew

      - name: Build Debug APK
        env:
          # Fully hands-off CI: the project toolkit key ships with the build so
          # every APK has a working AI brain, ElevenLabs voice and cloud STT.
          EXPO_PUBLIC_RORK_TOOLKIT_SECRET_KEY: ''
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
