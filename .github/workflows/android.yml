name: Build Jarvis Android App

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - 'arena/**'
  pull_request:
    branches:
      - main
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # FIX (audit P0-A): credentials were committed inline in this workflow AND in
  # ApiConfig.kt, eval/jarvis_eval.py and test_ai.sh. They are removed from the
  # repository and now come only from Actions secrets. This job makes the leak
  # non-repeatable: any credential-shaped literal in tracked source fails the build.
  secret-scan:
    name: Reject committed credentials
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Scan tracked source for credential patterns
        run: |
          set -euo pipefail
          # Known provider key shapes: NVIDIA (nvapi-), ElevenLabs (sk_), Google (AIza).
          # Deliberately scans code/config only -- documentation may legitimately show
          # placeholder shapes, and *.example files are empty by design.
          pattern='(nvapi-[A-Za-z0-9_-]{20,}|sk_[A-Za-z0-9]{20,}|AIza[0-9A-Za-z_-]{30,})'
          if git grep -nIE "$pattern" -- \
              '*.kt' '*.kts' '*.java' '*.xml' '*.py' '*.ts' '*.js' '*.json' \
              '*.sh' '*.yml' '*.yaml' '*.properties' '*.toml' ; then
            echo "::error::Credential-shaped literal found in tracked source."
            echo "Keys belong in Actions secrets (CI) or local.properties (gitignored)."
            echo "Rotate any key that was ever committed -- it must be treated as compromised."
            exit 1
          fi
          echo "No credential patterns found in tracked source."

  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

      - name: Make gradlew executable
        run: |
          sed -i -e 's/\r$//' gradlew
          chmod +x ./gradlew

      # FIX (audit P0-B): the previous "Create local.properties for CI" step wrote the
      # keys into local.properties, but app/build.gradle.kts read them from
      # System.getenv() -- which local.properties never populates. Every key compiled
      # in as an empty string. Secrets are now passed as environment variables, which
      # is what the build script actually reads (env first, local.properties second).
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace --no-daemon
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}

      - name: Report APK size
        run: |
          apk=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          size=$(stat -c%s "$apk")
          echo "APK: $apk"
          echo "Size: $((size / 1024 / 1024)) MiB ($size bytes)"
          echo "size_bytes=$size" >> "$GITHUB_OUTPUT"
        id: apksize

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
