workflows:
  android-debug:
    name: Android Debug APK
    max_build_duration: 60
    instance_type: linux

    environment:
      java: 17
      vars:
        PACKAGE_NAME: "com.jarvis.app"

    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: "*"
          include: true
          source: true

    scripts:
      - name: Prepare Gradle
        script: |
          chmod +x gradlew
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"

      - name: Build Debug APK
        script: |
          ./gradlew clean
          ./gradlew assembleDebug --stacktrace

    artifacts:
      - app/build/outputs/**/*.apk

    publishing:
      email:
        recipients:
          - smallzynum@gmail.com
        notify:
          success: true
          failure: true

  android-release:
    name: Android Release APK & AAB
    max_build_duration: 60
    instance_type: linux

    environment:
      java: 17
      groups:
        - keystore_credentials
      vars:
        PACKAGE_NAME: "com.jarvis.app"

    triggering:
      events:
        - tag
        - push
      branch_patterns:
        - pattern: "main"
          include: true
          source: true

    scripts:
      - name: Prepare Gradle
        script: |
          chmod +x gradlew
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"

      - name: Build Release APK
        script: |
          ./gradlew clean
          ./gradlew assembleRelease --stacktrace

      - name: Build Android App Bundle
        script: |
          ./gradlew bundleRelease --stacktrace

    artifacts:
      - app/build/outputs/**/*.apk
      - app/build/outputs/**/*.aab
      - app/build/outputs/**/mapping.txt

    publishing:
      email:
        recipients:
          - smallzynum@gmail.com
        notify:
          success: true
          failure: true
