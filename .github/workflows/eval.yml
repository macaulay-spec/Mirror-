name: JARVIS Brain Eval

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'eval/**'
      - 'app/src/main/java/com/jarvis/agent/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval:
    name: Utterance regression gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run brain eval
        run: python eval/jarvis_eval.py
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          EVAL_MODEL: nvidia/nemotron-3-super-120b-a12b
