name: Build Jarvis Android App

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - 'arena/**'
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

      - name: Create local.properties for CI
        run: cp local.properties.example local.properties

      - name: Make gradlew executable
        run: |
          sed -i -e 's/\r$//' gradlew
          chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee build.log

      - name: Report compile errors to the PR
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo "## ❌ Compile errors"
            echo
            echo '```'
            grep -E "^e: |error: |FAILURE: |Caused by:" build.log | head -60 || echo "(no error lines captured — see full log)"
            echo '```'
          } > errors.md
          gh pr comment "$PR_NUMBER" -R "$GITHUB_REPOSITORY" -F errors.md

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn
          retention-days: 7
